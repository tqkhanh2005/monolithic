name: P2 monolithic checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Prepare environment
        shell: pwsh
        run: ./scripts/setup.ps1
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: docker compose --profile test run --rm --build tests
      - run: npm run demo
      - if: always()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down
