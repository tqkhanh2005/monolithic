name: ecommerce-monolithic
services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [ ecommerce-net ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ecommerce-monolith
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-Customer@123}
      SEED_SHIPPER_PASSWORD: ${SEED_SHIPPER_PASSWORD:-Shipper@123}
      PORT: 3000
    ports: [ "127.0.0.1:${HOST_PORT:-3002}:3000" ]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ ecommerce-net ]

  tests:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ecommerce_test?schema=public
      JWT_SECRET: ${JWT_SECRET}
      BCRYPT_ROUNDS: 4
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-Customer@123}
      SEED_SHIPPER_PASSWORD: ${SEED_SHIPPER_PASSWORD:-Shipper@123}
    networks: [ ecommerce-net ]
    depends_on:
      app:
        condition: service_healthy

networks:
  ecommerce-net:
volumes:
  pgdata:
